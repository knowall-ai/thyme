name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs third-party package code (install, test, build), so it can't ask for an Azure token.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --run

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AZURE_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ secrets.NEXT_PUBLIC_AZURE_TENANT_ID }}
          NEXT_PUBLIC_AZURE_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_AZURE_REDIRECT_URI }}
          NEXT_PUBLIC_BC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BC_BASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Prepare standalone deployment
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo "Standalone deployment package prepared"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextjs-app
          include-hidden-files: true
          path: .next/standalone
          retention-days: 7

  # Only this job can get an OIDC token, and it runs no package code. The environment
  # records the deploy as a GitHub deployment and is what the federated credential trusts.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://gettimm.ie
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextjs-app

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .
          startup-command: 'node server.js'

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Production Deployment Complete! 🚀"
            echo
            echo "**Version:** $TAG"
            echo "**URL:** https://gettimm.ie"
            echo "**Commit:** \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ $TAG deployed to production: https://gettimm.ie"
